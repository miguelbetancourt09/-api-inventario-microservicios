services:
  productos-service:
    build: ./productos-service
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:mysql://db1:3306/db_productosservice?createDatabaseIfNotExist=true
      DB_USER: app
      DB_PASSWORD: app_local_123
    depends_on:
      db1:
        condition: service_healthy
    restart: unless-stopped
  existencias-service:
    build: ./existencias-service
    ports:
      - "8082:8080"
    environment:
      DB_URL: jdbc:mysql://db2:3306/db_existenciasservice?createDatabaseIfNotExist=true
      DB_USER: app
      DB_PASSWORD: app_local_123
      REFERENCE_URL: http://productos-service:8080/api/productos
    depends_on:
      db2:
        condition: service_healthy
      productos-service:
        condition: service_started
    restart: unless-stopped
  db1:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_123
      MYSQL_DATABASE: db_productosservice
      MYSQL_USER: app
      MYSQL_PASSWORD: app_local_123
    volumes:
      - datos1:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  db2:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_123
      MYSQL_DATABASE: db_existenciasservice
      MYSQL_USER: app
      MYSQL_PASSWORD: app_local_123
    volumes:
      - datos2:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  datos1:
  datos2:
